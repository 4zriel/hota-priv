name: HotA Turn Automation

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "RAPORT.md"

# GITHUB_TOKEN jest domyślnie read-only w nowych repo -> bez tego push raportu padnie.
permissions:
  contents: write

# Serializuje przebiegi: dwa pushe pod rząd nie będą się bić o RAPORT.md.
concurrency:
  group: hota-turn
  cancel-in-progress: false

jobs:
  process-turn:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v7
        with:
          # Pełna historia: push może zawierać więcej niż 1 commit, HEAD~1 to za mało.
          fetch-depth: 0
          ref: main

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generowanie raportu i weryfikacja plików
        run: python .github/scripts/turn_report.py

      - name: Zapisanie RAPORT.md do repozytorium
        run: |
          set -euo pipefail
          git config user.name "HotA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` MUSI być przed sprawdzeniem zmian: przy pierwszym przebiegu
          # RAPORT.md jest plikiem nieśledzonym, a `git diff` nieśledzonych nie widzi
          # - raport nigdy by się nie zacommitował.
          git add RAPORT.md
          if git diff --cached --quiet -- RAPORT.md; then
            echo "Brak zmian w raporcie."
            exit 0
          fi
          git commit -m "auto: aktualizacja RAPORT.md [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push odrzucony (próba $attempt), pobieram zmiany i ponawiam..."
            # || true: gdy rebase padnie, chcemy dojść do ::error:: poniżej,
            # a nie wywalić joba w połowie pętli (set -e).
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Nie udało się wypchnąć RAPORT.md po 3 próbach."
          exit 1

      - name: Powiadomienie na Discordzie
        # always(): powiadomienie jest ważniejsze niż raport. Nawet gdy push RAPORT.md
        # padnie, gracze muszą się dowiedzieć, że tura jest zrobiona.
        if: always()
        run: |
          set -uo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::Brak sekretu DISCORD_WEBHOOK - powiadomienie NIE zostało wysłane. Ustaw go w Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          if [ ! -f discord-payload.json ]; then
            echo "::warning::Brak discord-payload.json - raport nie wygenerował payloadu."
            exit 0
          fi
          if curl --fail --silent --show-error \
                  -H "Content-Type: application/json" \
                  -X POST \
                  --data @discord-payload.json \
                  "$DISCORD_WEBHOOK"; then
            echo "✅ Powiadomienie wysłane na Discorda."
          else
            echo "::error::Wysyłka na Discorda padła - sprawdź, czy webhook jest aktualny."
            exit 1
          fi
